services:
  nlweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlweb
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/code/python
      - PORT=8000
      - NLWEB_CONFIG_DIR=/app/config
      - QDRANT_URL=https://da6afcb6-59e1-4418-af17-e041b2397295.us-west-1-0.aws.cloud.qdrant.io:6333     
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    user: root
